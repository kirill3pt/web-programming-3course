<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мордочка котика — моргание</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page--light">
  <header class="site-header">
    <nav class="animation-menu" aria-label="Выбор анимации">
      <a
        class="animation-menu__link" href="index.html"
      >
        Моргание
      </a>

      <a class="animation-menu__link animation-menu__link--active" 
      href="animation2.html"
      aria-current="page">
        Взгляд
      </a>

      <a class="animation-menu__link" href="animation-3.html">
        Разговор
      </a>

      <a class="animation-menu__link" href="animation-4.html">
        Другая анимация
      </a>
    </nav>
  </header>
  <main class="container">
    <div class="figure">
      <div class="figure__base"></div>

      <div class="figure__bar figure__bar--wide">
        <div class="figure__stripe figure__stripe figure__stripe--left"></div>
        <div class="figure__sprout">
          <div class="figure__stem"></div>
          <div class="figure__leaf"></div>
        </div>
        <div class="figure__eyes">
          <div class="figure__eye figure__eye--right">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        
          <div class="figure__eye figure__eye--left">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        </div>
      </div>

      <div class="figure__bar figure__bar--tall">
        <div class="figure__stripe figure__stripe--right"></div>
        <div class="figure__sprout">
          <div class="figure__stem"></div>
        </div>
        <div class="figure__eyes">
          <div class="figure__eye figure__eye--right">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        
          <div class="figure__eye figure__eye--left">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
