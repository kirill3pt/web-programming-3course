<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2 фигуры</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="page--light">
  <header>
    <a href="index.html" class="back-button">
      <span class="back-button__arrow">←</span>
      <span>Назад</span>
    </a>
  </header>
  <main class="container">
    <div class="figure">
      <div class="figure__base"></div>

      <div class="figure__bar figure__bar--wide">
        <div class="figure__stripe figure__stripe figure__stripe--left"></div>
        <div class="figure__sprout">
          <div class="figure__stem"></div>
          <div class="figure__leaf"></div>
        </div>
        <div class="figure__eyes">
          <div class="figure__eye figure__eye--right">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        
          <div class="figure__eye figure__eye--left">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        </div>
      </div>

      <div class="figure__bar figure__bar--tall">
        <div class="figure__stripe figure__stripe--right"></div>
        <div class="figure__sprout">
          <div class="figure__stem"></div>
        </div>
        <div class="figure__mouth"></div>
        <div class="figure__eyes">
          <div class="figure__eye figure__eye--right">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        
          <div class="figure__eye figure__eye--left">
            <span class="figure__eye-dot"></span>
            <span class="figure__eye-line figure__eye-line--upper"></span>
            <span class="figure__eye-line figure__eye-line--lower"></span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
