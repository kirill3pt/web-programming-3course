<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конверт</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="background-animation3">
    <header>
        <a href="index.html" class="back-button">
        <span class="back-button__arrow">←</span>
        <span>Назад</span>
    </a>
    </header>
    <main class="container">
        <div class="envelope envelope--closed">
            <div class="envelope__shadow"></div>
            <div class="envelope__inside"></div>
    
            <article class="envelope__letter">
                <div class="envelope__letter-lines"></div>
                <div class="envelope__letter-stamp"></div>
            </article>
    
            <div class="envelope__face envelope__face--right"></div>
            <div class="envelope__face envelope__face--left"></div>
            <div class="envelope__face envelope__face--top"></div>
        </div>
    </main>
</body>
</html>
