<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мордочка котика</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <header>
        <a href="index.html" class="back-button">
            <span class="back-button__arrow">←</span>
            <span>Назад</span>
        </a>
    </header>
    <main class="container">
        <div class="cat">
            <div class="cat__ears-container">
                <div class="cat__ears">
                    <div class="cat__ear cat__ear--left">
                        <div class="cat__ear-inner"></div>
                    </div>

                    <div class="cat__ear cat__ear--right">
                        <div class="cat__ear-inner"></div>
                    </div>
                </div>
            </div>

            <div class="cat__eyes-container">
                <div class="cat__eyes">
                    <div class="cat__eye cat__eye--left"></div>
                    <div class="cat__eye cat__eye--right"></div>
                </div>
            </div>

            <div class="cat__nose-container">
                <div class="cat__nose"></div>
            </div>

            <div class="cat__mouth-container">
                <div class="cat__mouth"></div>
            </div>
        </div>
    </main>
</body>

</html>
