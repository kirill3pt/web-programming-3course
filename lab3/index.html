<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мордочка котика — моргание</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="animation-menu" aria-label="Выбор анимации">
      <a
        class="animation-menu__link animation-menu__link--active"
        href="index.html"
        aria-current="page"
      >
        Анимация №1
      </a>

      <a class="animation-menu__link" href="animation2.html">
        Анимация №2
      </a>

      <a class="animation-menu__link" href="animation-3.html">
        Анимация №3
      </a>

      <a class="animation-menu__link" href="animation-4.html">
        Анимация №4
      </a>
    </nav>
  </header>

  <main class="container">
    <div class="cat">
      <div class="cat__ears-container">
        <div class="cat__ears">
          <div class="cat__ear cat__ear--left">
            <div class="cat__ear-inner"></div>
          </div>

          <div class="cat__ear cat__ear--right">
            <div class="cat__ear-inner"></div>
          </div>
        </div>
      </div>

      <div class="cat__eyes-container">
        <div class="cat__eyes">
          <div class="cat__eye cat__eye--left"></div>
          <div class="cat__eye cat__eye--right"></div>
        </div>
      </div>

      <div class="cat__nose-container">
        <div class="cat__nose"></div>
      </div>

      <div class="cat__mouth-container">
        <div class="cat__mouth"></div>
      </div>
    </div>
  </main>
</body>
</html>
