<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Автомагазин</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-search">
                <div class="logo">
                    <img src="images/logo.png" alt="Автомагазин">
                </div>
                <search>
                    <form class="input-group" method="get" action="">
                        <input type="search" name="q" class="form-control" placeholder="Поиск...">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown">
                            Browse
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item" href="#">
                                    Шины и диски
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    Автомобильные масла
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    Запасные части
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item" href="#">
                                    Всё
                                </a>
                            </li>
                        </ul>
                    </form>
                </search>
            </div>
            <div class="cart">
                <img src="images/cart.svg" alt="Корзина">
            </div>
        </div>
        <aside>
            <hr>
            <ul class="main-menu">
                <li>
                    <a href="">ГЛАВНАЯ</a>
                </li>
                <li>
                    <a href="">ШИНЫ И ДИСКИ</a>
                    <ul class="submenu">
                        <li><a href="">Летние</a></li>
                        <li><a href="">Зимние</a></li>
                        <li><a href="">Всесезонные</a></li>
                    </ul>
                </li>
                <li>
                    <a href="">АВТОМОБИЛЬНЫЕ МАСЛА</a>
                    <ul class="submenu">
                        <li><a href="">Синтетика</a></li>
                        <li><a href="">Полусинтетика</a></li>
                        <li><a href="">Минеральное</a></li>
                    </ul>
                </li>
                <li>
                    <a href="">ЗАПАСНЫЕ ЧАСТИ</a>
                </li>
                <li>
                    <a href="">О НАС</a>
                </li>
            </ul>
            <hr>
        </aside>
    </header>
    <main>
        <section>
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/motul.jpg" class="d-block w-100" alt="Автомобильное масло">
                    </div>
                    <div class="carousel-item">
                        <img src="images/motul.jpg" class="d-block w-100" alt="Автомобильное масло">
                    </div>
                    <div class="carousel-item">
                        <img src="images/motul.jpg" class="d-block w-100" alt="Автомобильное масло">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">
                        Previous
                    </span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">
                        Next
                    </span>
                </button>
            </div>
        </section>
        <div class="grid-4">
            <a href="/" class="tile tile-1"><img src="" alt=""></a>
            <a href="#" class="tile tile-2"><img src="" alt=""></a>
            <a href="#" class="tile tile-3"><img src="" alt=""></a>
            <a href="#" class="tile tile-4"><img src="" alt=""></a>
        </div>
        <section>
            <h2>ПОПУЛЯРНЫЕ ПРЕДМЕТЫ</h2>
            <div class="grid-8">
                <a href="/" class="tile tile-1"><img src="" alt=""></a>
                <a href="#" class="tile tile-2"><img src="" alt=""></a>
                <a href="#" class="tile tile-3"><img src="" alt=""></a>
                <a href="#" class="tile tile-4"><img src="" alt=""></a>
                <a href="/" class="tile tile-5"><img src="" alt=""></a>
                <a href="#" class="tile tile-6"><img src="" alt=""></a>
                <a href="#" class="tile tile-7"><img src="" alt=""></a>
                <a href="#" class="tile tile-8"><img src="" alt=""></a>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
